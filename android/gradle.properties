org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Didit SDK variant selector (Phase 6) — disable NFC on Android too,
# to match the iOS Core variant choice. Keeps the AndroidManifest
# free of `<uses-feature android:name="android.hardware.nfc">` and
# lets the app install on devices without NFC hardware. Mirror of
# DIDIT_SDK_IOS_NFC_ENABLED=false in ios/Podfile.
diditSdkAndroidNfcEnabled=false
