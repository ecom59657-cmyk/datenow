name: datenow
description: "DateNow — Premium live-matching dating app."
publish_to: 'none'
version: 0.1.0+51

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.0

  # Models / immutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI / design system
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Media
  image_picker: ^1.1.2

  # Live call — Agora Flutter UIKit (high-level wrapper around
  # agora_rtc_engine). UIKit 1.3.10 references the legacy
  # `onExtensionError` handler that the agora_rtc_engine 6.5.x major
  # removed, so we pin the engine to the 6.3.x line that's still
  # backwards-compatible with UIKit.
  agora_uikit: ^1.3.10
  agora_rtc_engine: ">=6.3.0 <6.5.0"
  permission_handler: ^11.3.1

  # Native Didit identity verification SDK — wraps the iOS Swift +
  # Android Kotlin SDKs in a unified Dart API. Replaced url_launcher
  # in Phase 6 of the identity rollout : the user no longer leaves
  # DateNow for Safari, the SDK opens its own in-app verification UI
  # (camera, document scan, selfie, liveness). Core variant (no NFC)
  # — keeps iOS min at 13.0 and avoids the Apple NFC review video
  # ceremony.
  didit_sdk: ^4.0.2

  # Geolocation — phase 1.1 of the matching refactor. Wraps the
  # platform geolocator + permission flow. We only fetch a coarse
  # one-shot position when the user grants consent and push it to
  # Supabase via the `update_my_location` RPC. No background tracking.
  geolocator: ^13.0.2

  # Apple Sign In — auth sub-phase D. Provides
  # `SignInWithApple.getAppleIDCredential` which surfaces the iOS native
  # AuthenticationServices sheet. The returned ID token is exchanged
  # with Supabase via `signInWithIdToken(provider: apple, …)`. Required
  # for App Store review compliance once Google Sign In ships (sub-
  # phase E): the two methods must be at parity on the auth landing.
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Google Sign In — auth sub-phase E. Reads CLIENT_ID +
  # REVERSED_CLIENT_ID from ios/Runner/GoogleService-Info.plist and
  # surfaces the iOS native Google sign-in sheet (no web view, no
  # browser hop). Returns an ID token we hand to Supabase via
  # `signInWithIdToken(provider: google, …)`. The reverse-DNS URL
  # scheme must also be present in Info.plist for the iOS callback to
  # reach the app — see ios/Runner/Info.plist.
  google_sign_in: ^6.2.1

  # Push notifications — Firebase Messaging used ONLY as the iOS APNs
  # bridge (device token retrieval, foreground/background callbacks).
  # The actual push payload is signed + sent by our `message-notification`
  # Supabase Edge Function over APNs HTTP/2 — no FCM topic, no Firebase
  # Analytics, no Crashlytics. GoogleService-Info.plist must be dropped
  # into ios/Runner/ for delivery to activate; init is wrapped in try/
  # catch so its absence never crashes the app.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Config
  flutter_dotenv: ^5.2.1

  # Utilities — `intl` is pinned by flutter_localizations, so accept any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pinned to 3.x while agora_uikit 1.3.x still depends on `lints <3.0.1`.
  flutter_lints: ^3.0.2

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # App icon generation — turns assets/logo/datenow_logo.png into the full
  # iOS AppIcon set (and Android mipmaps), replacing the default Flutter icon.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/logo/

  # Fonts are loaded via google_fonts at runtime — no bundled assets needed.

# App-icon generation (flutter_launcher_icons). The master is an opaque
# 1024² PNG; remove_alpha_ios is belt-and-suspenders for the App Store
# "no alpha channel" rule. Regenerate after changing the logo with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/logo/datenow_logo.png"
  remove_alpha_ios: true
